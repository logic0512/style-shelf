name: Style Shelf desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: ${{ matrix.os }} desktop package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac:universal
          - os: windows-latest
            command: dist:win
          - os: ubuntu-latest
            command: dist:linux

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.x
          cache: npm
      - run: npm ci
      - run: npm run bootstrap
      - run: npm run check:bundled-licenses
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: style-shelf-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: style-shelf-*
          path: release
          merge-multiple: true
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find release -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name 'Style-Shelf-*.exe' -o -name '*.AppImage' \
          \) -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Style Shelf $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
