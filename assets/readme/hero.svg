<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Style Shelf</title>
  <desc id="desc">把图片风格 Skill 和 Prompt 模板连接到创作工作区与本地图库的本地优先工作台。</desc>

  <rect width="1200" height="380" rx="24" fill="#f5f7fa"/>
  <rect x="48" y="42" width="44" height="44" rx="4" fill="#151b24"/>
  <text x="70" y="73" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#ffffff">S</text>
  <text x="108" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="3" fill="#151b24">STYLE SHELF</text>
  <text x="108" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.5" fill="#6c7788">LOCAL IMAGE WORKBENCH · v0.2.0</text>

  <text x="48" y="154" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="68" font-weight="760" letter-spacing="-2" fill="#151b24">Style Shelf</text>
  <text x="48" y="199" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="560" fill="#283241">把生图 Skill 和 Prompt 变成可浏览、可运行、可保存的本地工作台</text>
  <text x="48" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#6c7788">Browse a style. Make it yours. Keep the result locally.</text>

  <line x1="48" y1="258" x2="1152" y2="258" stroke="#ccd3dd"/>

  <g id="workflow" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(48 280)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1d5cff">S.01</text>
      <text x="0" y="46" font-size="24" font-weight="700" fill="#151b24">Skill 风格</text>
    </g>
    <path d="M282 312h40" stroke="#1d5cff" stroke-width="2"/>
    <path d="m316 306 8 6-8 6" fill="none" stroke="#1d5cff" stroke-width="2"/>

    <g transform="translate(352 280)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1d5cff">P.01</text>
      <text x="0" y="46" font-size="24" font-weight="700" fill="#151b24">Prompt 模板</text>
    </g>
    <path d="M590 312h40" stroke="#1d5cff" stroke-width="2"/>
    <path d="m624 306 8 6-8 6" fill="none" stroke="#1d5cff" stroke-width="2"/>

    <g transform="translate(660 280)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1d5cff">03</text>
      <text x="0" y="46" font-size="24" font-weight="700" fill="#151b24">创作工作区</text>
    </g>
    <path d="M880 312h40" stroke="#1d5cff" stroke-width="2"/>
    <path d="m914 306 8 6-8 6" fill="none" stroke="#1d5cff" stroke-width="2"/>

    <g transform="translate(952 280)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1d5cff">04</text>
      <text x="0" y="46" font-size="24" font-weight="700" fill="#151b24">本地图库</text>
    </g>
  </g>

  <rect x="48" y="357" width="1104" height="3" fill="#1d5cff"/>
</svg>
